name: Backend Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "school-mgmt/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "school-mgmt/backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mgmt/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: school-mgmt/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school-mgmt/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: school-mgmt/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run critical regression smoke
        run: npm run test:unit -- --runInBand src/orders/order-workflow.service.spec.ts src/wallets/wallets.service.spec.ts src/sessions/session-payroll.service.spec.ts src/attendance/attendance-link.service.spec.ts src/users/users.service.spec.ts

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: |
            school-mgmt/backend/test-results/unit/junit.xml
            school-mgmt/backend/coverage/unit
          if-no-files-found: ignore

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-test-results
          path: school-mgmt/backend/test-results/e2e/junit.xml
          if-no-files-found: ignore
